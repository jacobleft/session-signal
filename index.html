<!doctype html>
<html lang="en" data-theme="sunset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b232d" />
    <meta
      name="description"
      content="A clear, synchronized dual timer for interviews and presentations."
    />
    <title>Session Signal — Dual interview timer</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Session Signal">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span>Session Signal</span>
        </div>
        <div class="operator-corner">
          <aside class="session-clock" data-timer="session" aria-label="Full session timer">
            <div class="session-clock__readout">
              <span class="session-clock__label">Session</span>
              <span class="session-clock__time" id="sessionDisplay" role="timer" aria-live="off">00:00</span>
              <span class="session-clock__target">/ <span id="sessionTarget">20:00</span></span>
            </div>
            <div class="session-clock__track" aria-hidden="true"><span id="sessionProgress"></span></div>
            <span class="visually-hidden" id="sessionState">Ready</span>
          </aside>
          <span class="wake-indicator" id="wakeStatus" title="Screen wake lock" aria-label="Screen wake lock inactive"><span aria-hidden="true"></span></span>
          <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter full screen" title="Full screen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          </button>
          <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" aria-expanded="false" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V21h-4v-.08A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 8.96 4.6 1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>

      <section class="presentation-stage" data-timer="presentation" aria-labelledby="presentationTitle">
        <div class="presentation-stage__label">
          <span class="signal-dot" aria-hidden="true"></span>
          <h1 id="presentationTitle">Presentation</h1>
          <span class="presentation-stage__target"><span id="presentationTarget">05:00</span> target</span>
        </div>
        <div class="presentation-time" id="presentationDisplay" role="timer" aria-live="off">00:00</div>
        <div class="presentation-progress" aria-hidden="true"><span id="presentationProgress"></span></div>
        <div class="presentation-stage__controls">
          <span class="presentation-state" id="presentationState">Ready</span>
          <button class="button button--primary" id="startBothButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
            <span>Start</span>
          </button>
        </div>
      </section>
    </main>

    <div class="alarm-banner" id="alarmBanner" role="alert" hidden>
      <div>
        <strong id="alarmTitle">Time is up</strong>
        <span id="alarmMessage">Presentation timer finished</span>
      </div>
      <button class="button button--light" id="dismissAlarmButton" type="button">Dismiss alarm</button>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="settings-drawer" id="settingsDrawer" aria-labelledby="settingsTitle" aria-hidden="true">
      <header class="drawer-header">
        <div>
          <h2 id="settingsTitle">Timer setup</h2>
          <p>Changes apply when a timer is reset.</p>
        </div>
        <button class="icon-button" id="closeSettingsButton" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <form id="settingsForm">
        <fieldset>
          <legend>Durations</legend>
          <div class="duration-row">
            <span class="field-name"><i class="field-dot field-dot--presentation"></i>Presentation</span>
            <label><span>Minutes</span><input id="presentationMinutes" type="number" min="0" max="599" value="5" inputmode="numeric" /></label>
            <label><span>Seconds</span><input id="presentationSeconds" type="number" min="0" max="59" value="0" inputmode="numeric" /></label>
          </div>
          <div class="duration-row">
            <span class="field-name"><i class="field-dot field-dot--session"></i>Full session</span>
            <label><span>Minutes</span><input id="sessionMinutes" type="number" min="0" max="599" value="20" inputmode="numeric" /></label>
            <label><span>Seconds</span><input id="sessionSeconds" type="number" min="0" max="59" value="0" inputmode="numeric" /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Sound</legend>
          <label class="select-field">
            <span>Alarm style</span>
            <select id="soundStyle">
              <option value="chime">Clear chime</option>
              <option value="bell">Desk bell</option>
              <option value="pulse">Digital pulse</option>
              <option value="gentle">Gentle tone</option>
            </select>
          </label>
          <label class="range-field">
            <span>Volume <output id="volumeOutput">70%</output></span>
            <input id="volume" type="range" min="0" max="100" value="70" />
          </label>
          <label class="switch-field">
            <span><strong>Start sound</strong><small>Play a short cue when timers start</small></span>
            <input id="startSound" type="checkbox" checked />
            <i aria-hidden="true"></i>
          </label>
          <button class="button button--secondary button--wide" id="previewSoundButton" type="button">Preview alarm</button>
        </fieldset>

        <fieldset>
          <legend>Display</legend>
          <label class="select-field">
            <span>Visual theme</span>
            <select id="visualTheme">
              <option value="sunset">Sunset</option>
              <option value="nord">Nord</option>
              <option value="dracula">Dracula</option>
              <option value="synthwave">Synthwave</option>
              <option value="cyberpunk">Cyberpunk</option>
              <option value="business">Business</option>
              <option value="coffee">Coffee</option>
              <option value="light">Light</option>
            </select>
          </label>
        </fieldset>

        <button class="button button--primary button--wide" type="submit">Save and reset timers</button>
      </form>
    </aside>

    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
